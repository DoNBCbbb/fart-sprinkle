<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word-search maker — Fart Sprinkle Studios</title>
<style>
:root{--navy:#1F3A5F;--pumpkin:#C45C26;--cream:#FFF8EF}
body{margin:0;font-family:Georgia,serif;background:var(--cream)}
header{background:var(--navy);color:#fff;padding:16px 20px}
main{max-width:760px;margin:0 auto;padding:20px}
textarea,button{font:inherit}
textarea{width:100%;min-height:90px}
button{background:var(--pumpkin);color:#fff;border:0;padding:10px 14px;border-radius:6px;font-weight:700;cursor:pointer}
.row{display:flex}
.cell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid #ead9c6;background:#fff;font-weight:700}
@media print{header,form,a,.no-print{display:none} .cell{border-color:#000}}
</style>
</head>
<body>
<header>Fart Sprinkle Studios · maker</header>
<main>
<p><a href="index.html">← tools</a></p>
<h1>Make a large-print word search</h1>
<p>One word per line. Letters only. Stays in your browser.</p>
<form class="no-print" onsubmit="make(event)">
<textarea id="words">PUMPKIN
CIDER
HAYRIDE
ORCHARD
LANTERN</textarea>
<p><button type="submit">Build grid</button></p>
</form>
<div id="out"></div>
<p class="no-print"><a href="https://payhip.com/b/804FN">Tip jar</a> · <a href="https://payhip.com/FartSprinkleStudios">Paid 20-packs</a></p>
<script>
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const DIRS=[[1,0],[0,1],[1,1],[-1,1]];
function make(e){e.preventDefault();
const words=document.getElementById('words').value.toUpperCase().split(/\s+/).map(w=>w.replace(/[^A-Z]/g,'')).filter(w=>w.length>=3&&w.length<=12).slice(0,12);
const n=12;let grid=Array.from({length:n},()=>Array(n).fill(''));
function ok(x,y,dx,dy,w){for(let i=0;i<w.length;i++){const xx=x+dx*i,yy=y+dy*i;if(xx<0||yy<0||xx>=n||yy>=n)return false;if(grid[yy][xx]&&grid[yy][xx]!==w[i])return false}return true}
function put(w){for(let t=0;t<80;t++){const [dx,dy]=DIRS[Math.floor(Math.random()*DIRS.length)];const x=Math.floor(Math.random()*n),y=Math.floor(Math.random()*n);if(!ok(x,y,dx,dy,w))continue;for(let i=0;i<w.length;i++)grid[y+dy*i][x+dx*i]=w[i];return true}return false}
words.forEach(put);
for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!grid[y][x])grid[y][x]=ABC[Math.floor(Math.random()*26)];
const wrap=document.getElementById('out');wrap.innerHTML='';
grid.forEach(row=>{const r=document.createElement('div');r.className='row';row.forEach(ch=>{const c=document.createElement('div');c.className='cell';c.textContent=ch;r.appendChild(c)});wrap.appendChild(r)});
const ul=document.createElement('ul');words.forEach(w=>{const li=document.createElement('li');li.textContent=w;ul.appendChild(li)});wrap.appendChild(ul);
}
</script>
</main>
</body>
</html>
