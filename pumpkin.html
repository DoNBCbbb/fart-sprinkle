<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pumpkin Patch mini — Fart Sprinkle Studios</title>
<style>
:root{--navy:#1F3A5F;--pumpkin:#C45C26;--cream:#FFF8EF}
body{margin:0;font-family:Georgia,serif;background:var(--cream)}
header{background:var(--navy);color:#fff;padding:16px 20px}
main{max-width:720px;margin:0 auto;padding:20px}
.row{display:flex}
.cell{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;border:1px solid #ead9c6;background:#fff}
ul{columns:2}
a{color:var(--navy)}
.btn{display:inline-block;padding:10px 14px;background:var(--pumpkin);color:#fff;text-decoration:none;border-radius:6px;font-weight:700}
</style>
</head>
<body>
<header>Fart Sprinkle Studios · pumpkin mini</header>
<main>
<p><a href="index.html">← tools</a></p>
<h1>Pumpkin Patch</h1>
<div id="grid"></div>
<h2>Find</h2>
<ul id="words"></ul>
<p><a class="btn" href="https://payhip.com/b/804FN">Tip jar</a>
<a class="btn" style="background:#1F3A5F" href="https://payhip.com/FartSprinkleStudios">20-packs</a></p>
<script>
const G=[['P','U','M','P','K','I','N','Q','L','A'],['A','O','R','A','N','G','E','V','A','U'],['T','V','I','N','E','S','E','E','D','T'],['C','X','S','T','E','M','B','W','D','U'],['H','L','A','N','T','E','R','N','F','M'],['A','U','T','U','M','N','G','O','R','N'],['R','G','O','U','R','D','J','K','P','H'],['V','P','A','T','C','H','M','Y','Z','S'],['E','B','C','D','F','H','J','K','L','T'],['S','W','X','Y','Z','Q','R','S','T','S']];
const WORDS=['PUMPKIN','ORANGE','VINE','SEED','STEM','LANTERN','AUTUMN','GOURD','PATCH'];
const box=document.getElementById('grid');
G.forEach(row=>{const r=document.createElement('div');r.className='row';row.forEach(ch=>{const c=document.createElement('div');c.className='cell';c.textContent=ch;r.appendChild(c)});box.appendChild(r)});
WORDS.forEach(w=>{const li=document.createElement('li');li.textContent=w;document.getElementById('words').appendChild(li)});
</script>
</main>
</body>
</html>
